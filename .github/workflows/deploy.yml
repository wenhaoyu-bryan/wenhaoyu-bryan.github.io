name: Deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  # Agent Anatomy is a separate Pages deployment. Refresh the published
  # episode roster even when this repository has no new commits.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.1

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Sync published Agent Anatomy sitemap routes
        run: python3 scripts/sync-agent-anatomy-sitemap.py "$RUNNER_TEMP/agent-anatomy-sitemap.json"

      - name: Build the project
        run: pnpm run build
        env:
          AGENT_ANATOMY_SITEMAP_FILE: ${{ runner.temp }}/agent-anatomy-sitemap.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
